events {
    worker_connections 1024;
}

http {
    upstream gateway  { server gateway:8000; }
    upstream studio   { server studio:8000; }
    upstream leads    { server leads:8000; }
    upstream agents   { server agents:8000; }
    upstream platform { server platform:8000; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;

        location /api/gateway/ {
            rewrite ^/api/gateway/(.*) /$1 break;
            proxy_pass http://gateway;
        }

        location /api/studio/ {
            rewrite ^/api/studio/(.*) /$1 break;
            proxy_pass http://studio;
        }

        location /api/leads/ {
            rewrite ^/api/leads/(.*) /$1 break;
            proxy_pass http://leads;
        }

        location /api/agents/ {
            rewrite ^/api/agents/(.*) /$1 break;
            proxy_pass http://agents;
        }

        location /api/platform/ {
            rewrite ^/api/platform/(.*) /$1 break;
            proxy_pass http://platform;
        }

        location / {
            proxy_pass http://frontend;
        }
    }
}
