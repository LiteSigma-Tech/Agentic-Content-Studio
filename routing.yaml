# Routing config — change this and the NEXT job uses the new model. No redeploy.
#
# Mock fallbacks have been intentionally removed. When all providers in a chain
# fail, the router raises NoEligibleProvider → gateway returns 409 → the pipeline
# stage is marked "failed" and stops. Re-run the project to resume from the
# failed stage — the checkpoint system retries only the failed step.
#
# Provider auto-registration (bootstrap.py registers a provider only when its
# env var is set):
#   OLLAMA_HOST=http://host.docker.internal:11434  -> ollama/* models active
#   OPENROUTER_API_KEY=sk-or-...                   -> openrouter/* models active
#   COMFYUI_URL=http://host.docker.internal:8188   -> comfyui/* models active
#   AWS_BEDROCK_REGION=us-east-1 + credentials     -> bedrock/* models active
#   REPLICATE_API_TOKEN=r8_...                     -> replicate/* models active
#   HF_API_TOKEN=hf_...                            -> hf/* models active

routing:
  llm:
    script_writing:
      default: "bedrock/claude-haiku"
      fallbacks: ["ollama/qwen2.5:7b", "openrouter/qwen-2.5-72b:free", "hf/mistral-7b"]

    agent_reasoning:
      default: "bedrock/claude-sonnet"
      require: ["function_calling"]
      fallbacks: ["bedrock/claude-haiku", "ollama/qwen2.5:7b"]

    kids_content:
      default: "bedrock/claude-haiku"
      require: ["moderation_ok"]
      fallbacks: ["ollama/qwen2.5:7b"]

  image:
    default:
      default: "replicate/flux-schnell"
      fallbacks: ["hf/flux-schnell", "comfyui/flux-schnell"]

  video:
    default:
      # Quality order: best providers first. Only registered models are used;
      # unregistered ones (missing API key) are silently skipped by the router.
      default: "runway/gen4-turbo"
      fallbacks:
        - "luma/dream-machine"
        - "replicate/kling"
        - "replicate/hunyuan"
        - "replicate/mochi"
        - "replicate/animate-diff"
        - "comfyui/ltx-video"

  tts:
    default:
      default: "deepgram/aura-2"
      fallbacks: ["replicate/kokoro", "comfyui/kokoro"]

  music:
    default:
      default: "replicate/musicgen"
      fallbacks: ["comfyui/musicgen"]

policy:
  max_cost_per_job_usd: 0.10
  prefer: "route_order"
