[alembic]
# Path to migration scripts
script_location = alembic

# Naming convention for generated revision files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# sys.path is prepended with this (so db.models is importable)
prepend_sys_path = .

# Separator for multiple version paths
version_path_separator = os

# sqlalchemy.url is set dynamically from DATABASE_URL in alembic/env.py — do
# not set it here so credentials never end up in version control.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
